name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs `npm run build`, whose prebuild and postbuild hooks run astro check,
      # the content-parity and typography checks, and the dist checks. A failure
      # here means nothing is uploaded, so a broken build cannot reach the site.
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    # Pull requests build and run the checks but must not deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Requires a repository variable INDEXNOW_KEY (Settings, Secrets and variables,
  # Actions, Variables) matching the key file in public/. It is a variable rather
  # than a secret because the key is published at /<key>.txt by design.
  indexnow:
    if: github.event_name != 'pull_request' && vars.INDEXNOW_KEY != ''
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs
