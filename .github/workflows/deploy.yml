name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Bing, Yandex, Seznam and Naver consume IndexNow. Google does not. The reason
  # to bother is that Bing's index is what ChatGPT search reads, so this is the
  # shortest path from "published" to "an assistant can cite it".
  #
  # Requires a repository variable INDEXNOW_KEY (Settings, Secrets and variables,
  # Actions, Variables) matching the filename in public/. It is a variable rather
  # than a secret because the key is published at /<key>.txt by design.
  indexnow:
    needs: deploy
    if: ${{ vars.INDEXNOW_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          curl -sSf https://numericoasis.com/sitemap-0.xml             | grep -oP '(?<=<loc>)[^<]+'             | head -n 10000 > urls.txt
          echo "Submitting $(wc -l < urls.txt) URLs"
          jq -n             --arg host "numericoasis.com"             --arg key "$INDEXNOW_KEY"             --arg keyLocation "https://numericoasis.com/$INDEXNOW_KEY.txt"             --rawfile urls urls.txt             '{host: $host, key: $key, keyLocation: $keyLocation,
              urlList: ($urls | split("
") | map(select(length > 0)))}' > payload.json
          curl -sS -X POST "https://api.indexnow.org/IndexNow"             -H "Content-Type: application/json; charset=utf-8"             --data @payload.json -w '
HTTP %{http_code}
'
